name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Versions agree
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const read = (p) => JSON.parse(readFileSync(p, 'utf8'));
          const v = read('.claude-plugin/plugin.json').version;
          const m = read('.claude-plugin/marketplace.json');
          const bad = [m.metadata.version, m.plugins[0].version].filter((x) => x !== v);
          if (!readFileSync('CHANGELOG.md', 'utf8').includes(`## ${v}`)) bad.push('CHANGELOG.md');
          if (bad.length) { console.error(`versions disagree with ${v}:`, bad); process.exit(1); }
          JS
      - run: npx -y @anthropic-ai/claude-code plugin validate .
      - run: npx -y @anthropic-ai/claude-code plugin test .
